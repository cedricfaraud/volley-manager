name: Android build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          cache-disabled: true
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: volley-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare stable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk volley-manager-latest.apk
      - name: Publish latest APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "$GITHUB_SHA" --title "Volley Manager - dernière version"
          else
            gh release create latest --target "$GITHUB_SHA" --title "Volley Manager - dernière version" --notes "APK debug générée automatiquement depuis main."
          fi
          gh release upload latest volley-manager-latest.apk --clobber
